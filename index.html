/* ================= ASSET LOADING ================= */
const mgr=new THREE.LoadingManager();mgr.onError=u=>{diag.errors.push('FAILED: '+u);$('err').textContent+='Failed to load: '+u+'\n'};

 setProg('car',0,'Loading Jesko Attack FBX (16 MB)…');
 const fbx=new FBXLoader(mgr);fbx.setResourcePath('./');

let ground=null;

 // The supplied GLB is a material-preview sphere (53,936 verts). Only its PBR textures are used, on a large tiled plane.

/* ================= CAR: MATERIALS, NORMALIZATION, MEASUREMENT ================= */
function convertMat(m){const n=(m.name||'').toLowerCase(),map=m.map||null,nm=m.normalMap||null;let r;
 if(/paint/.test(n))r=new THREE.MeshPhysicalMaterial({color:0xc4c9d1,metalness:.85,roughness:.3,clearcoat:1,clearcoatRoughness:.06});
 else if(/glass_light/.test(n))r=new THREE.MeshPhysicalMaterial({color:0xcfd8e0,metalness:0,roughness:.05,transparent:true,opacity:.35});
 else if(/glass/.test(n))r=new THREE.MeshPhysicalMaterial({color:0x080c10,metalness:0,roughness:.04,transparent:true,opacity:.42,envMapIntensity:1.6});
 else if(/carbon/.test(n))r=new THREE.MeshStandardMaterial({color:0xffffff,map,normalMap:nm,metalness:.35,roughness:.38});
 else if(/tyre|tire/.test(n))r=new THREE.MeshStandardMaterial({color:0xffffff,map,normalMap:nm,metalness:0,roughness:.88});
 else if(/rim|brake/.test(n))r=new THREE.MeshStandardMaterial({color:0xffffff,map,normalMap:nm,metalness:.9,roughness:.3});
 else if(/mirror|exhaust|tinfoil/.test(n))r=new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.15});
 else if(/light|logo/.test(n))r=new THREE.MeshStandardMaterial({color:0xffffff,map,normalMap:nm,metalness:.2,roughness:.3});

const _v=V3();

const WHEELRE=/rim|tyre|tire|brake|wheel|caliper|disc/i;

function buildCar(model){

/* ================= DIAGNOSTICS ================= */
function diagText(){const k=camKey(S.T);return ['t='+S.T.toFixed(2)+'s  scene '+(sceneAt(S.T)+1)+': '+SCENES[sceneAt(S.T)].n,'camera (L units) fwd/up/right '+k.p.map(v=>v.toFixed(2)).join(' / ')+'  fov '+k.fov.toFixed(1),'quality '+quality+' '+view.width+'x'+view.height+'  particles/line '+fx.density,'--- assets / model ---',...diag.lines,...diag.errors,'Procedural (not factory geometry): streamlines, pressure blobs, arrows, cutaway section, flap schematic, inset schematics.'].join('\n')}
function setupHelpers(){const g=new THREE.Group(),b=new THREE.Box3Helper(car.box,0xffff00),ax=new THREE.AxesHelper(2),ar=new THREE.ArrowHelper(V3(1,0,0),V3(0,.05,0),car.L*.7,0x00ff88);g.add(b,ax,ar,new THREE.GridHelper(20,20,0x444444,0x222222));car.root.add(g);g.visible=false;car.helpers=g}

/* ================= UI ================= */
function buildUI(){
 $('chips').innerHTML=SCENES.map((s,i)=>`<button data-s="${i}" title="${s.n}">${i+1}</button>`).join('');
 $('chips').onclick=e=>{const b=e.target.closest('button');if(b)seek(SCENES[+b.dataset.s].t0+.05)};
 $('play').onclick=()=>{S.playing?pause():play()};$('restart').onclick=()=>{seek(0);play()};
 const sc=$('scrub');sc.addEventListener('input',()=>{S.scrubbing=true;seek(sc.value/1000)});sc.addEventListener('change',()=>{S.scrubbing=false});
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
  if(k==='inspect'){S.inspect=on;controls.enabled=on;view.style.touchAction=on?'none':'pan-y';if(on)controls.update();else resetCam();$('dbg').style.display=on?'block':'none'}else LAY[k]=on?1:0});
 $('rcam').onclick=resetCam;
 $('snd').onclick=()=>{initAudio();A.muted=!A.muted;$('snd').setAttribute('aria-pressed',!A.muted);$('snd').textContent=A.muted?'Sound off':'Sound on';if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume()};
 $('vol').oninput=e=>{A.vol=+e.target.value};
 $('say').onclick=()=>{S.narr=!S.narr;$('say').setAttribute('aria-pressed',S.narr);if(S.narr)speakCheck(true);else if(window.speechSynthesis)speechSynthesis.cancel()};
 $('qual').onchange=e=>applyQuality(e.target.value);$('spd').onchange=e=>{S.speed=+e.target.value;S.tRef=S.T;S.wall0=performance.now()};
 $('rec').onclick=()=>{if(rec.on){if(rec.mr&&rec.mr.state!=='inactive')rec.mr.stop()}else startRecording()};
 document.addEventListener('visibilitychange',()=>{if(rec.on)return;if(document.hidden){S.hidWas=S.playing;if(S.playing)pause()}else if(S.hidWas){S.hidWas=false;play()}});
 addEventListener('beforeunload',()=>{renderer.dispose();if(rec.mr&&rec.mr.state!=='inactive')rec.mr.stop()});
}
function resetCam(){S.inspect=false;controls.enabled=false;view.style.touchAction='pan-y';document.querySelector('[data-k=inspect]').setAttribute('aria-pressed','false');$('dbg').style.display='none'}
function updateDOM(){const T=S.T,i=sceneAt(T);$('tm').textContent=fmt(T)+' / '+fmt(DUR);if(!S.scrubbing)$('scrub').value=Math.round(T*1000);
 if(i!==S.sceneIdx){speakCheck(false);S.sceneIdx=i;$('scn').textContent='Scene '+String(i+1).padStart(2,'0')+' · '+SCENES[i].n;document.querySelectorAll('#chips button').forEach((b,j)=>b.style.borderColor=j===i?'var(--cy)':'')}
 if(S.inspect&&(performance.now()-lastExp>250)){lastExp=performance.now();$('dbg').textContent=diagText()}}

/* ================= MAIN ================= */
function frame(){requestAnimationFrame(frame);if(!car)return;tick();applyState(S.T);renderer.render(scene,camera);drawOverlays(S.T);audioUpdate(S.T);updateDOM()}
async function main(){buildUI();applyQuality(quality);
 try{const {model,hdr,glb}=await loadAssets();setupEnvironment(hdr);setupGround(glb);car=buildCar(model);fx=buildFX();setupHelpers();applyQuality(quality);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(car.L*1.15,car.W*1.5),new THREE.MeshBasicMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,6,64,64,64);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})(),transparent:true,opacity:.7,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.position.y=.006;car.root.add(sh); // contact-shadow blob under the car
  $('load').style.display='none';D('All assets loaded. Errors:',diag.errors.length);window.__jesko={S,seek,play,pause,car,fx,diag};frame()}
 catch(e){console.error(e);$('ls').textContent='Load failed';$('err').textContent+=(e&&e.stack||e)+'\n\nServe this folder over HTTP (python3 -m http.server 8000) and keep all files from the manifest next to index.html.'}}
main();
</script>
</body>
</html>
